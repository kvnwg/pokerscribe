[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "pokerscribe_engine"
description = "The PokerScribe Rust engine from Python: the hand evaluator and the No-Limit Hold'em rules engine."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]

[tool.maturin]
# The bindings are behind a Cargo feature so that plain cargo builds don't need Python.
features = ["python"]
module-name = "pokerscribe_engine"
