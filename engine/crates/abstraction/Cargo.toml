[package]
name = "abstraction"
version = "0.1.0"
edition = "2021"
description = "Hand abstraction for heads-up No-Limit Hold'em: suit isomorphism, potential-aware buckets with earth mover's distance, bucket tables on disk."
publish = false

[dependencies]
eval = { path = "../eval" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "abstraction-build"
path = "src/bin/abstraction-build.rs"
