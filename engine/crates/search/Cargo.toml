[package]
name = "search"
version = "0.1.0"
edition = "2021"
description = "Depth-limited search for heads-up No-Limit Hold'em (Phase 7 groundwork): Bayesian ranges from the blueprint, river and turn subgames solved with subgame, a depth-limited flop with Modicum's continuation strategies at the leaves, unsafe re-solving from the start of the street."
publish = false

[dependencies]
abstract_game = { path = "../abstract_game" }
arena = { path = "../arena" }
blueprint = { path = "../blueprint" }
cfr = { path = "../cfr" }
eval = { path = "../eval" }
lbr = { path = "../lbr" }
nlhe = { path = "../nlhe", features = ["eval"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subgame = { path = "../subgame" }

[[bin]]
name = "search"
path = "src/bin/search.rs"
